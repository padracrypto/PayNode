[profile.default]
src = "contracts"
test = "test"
out = "contracts/out"
# NOT the default "lib" — that path is already the Next.js lib/ directory in this repo.
libs = ["contracts/lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
    "forge-std/=contracts/lib/forge-std/src/",
]

[fmt]
line_length = 110
tab_width = 4

[invariant]
runs = 128
depth = 400
fail_on_revert = false
