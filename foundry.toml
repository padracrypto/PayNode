[profile.default]
src = "contracts"
test = "test"
out = "contracts/out"
# NOT the default "lib" — that path is already the Next.js lib/ directory in this repo.
libs = ["contracts/lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
    "forge-std/=contracts/lib/forge-std/src/",
]

# `src` covers the whole contracts/ tree (including contracts/lib), so the
# OpenZeppelin submodule's Certora formal-verification harnesses get swept
# into compilation and fail on their internal relative imports. They aren't
# used by this project, so exclude them.
skip = ["contracts/lib/openzeppelin-contracts/certora/**/*.sol"]

[fmt]
line_length = 110
tab_width = 4

[invariant]
runs = 128
depth = 400
fail_on_revert = false
